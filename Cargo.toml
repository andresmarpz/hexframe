[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
greyscreen-core = { path = "crates/core" }
greyscreen-mp4 = { path = "crates/mp4" }
greyscreen-league = { path = "crates/league" }
greyscreen-capture = { path = "crates/capture" }
greyscreen-engine = { path = "crates/engine" }
windows = "0.62"
wasapi = "0.27"
ureq = { version = "3", features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
jiff = "0.2"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
winresource = "0.1"
png = "0.18"
rune = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8", default-features = false }

[patch.crates-io]
winit             = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }
sctk-adwaita      = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }
parley_engine     = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }
wgpu-hal          = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }
accesskit_macos   = { git = "https://github.com/anomalyco/rune", rev = "eb9f11047bbe2b3927ad4b65ffcf7bfef4d3deb8" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
await_holding_lock = "deny"
dbg_macro = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16
