name: Windows

on:
  push:
    branches: [main]
    tags: ['v*', '!v*-*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked

  build:
    runs-on: windows-latest
    env:
      BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci-release' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --profile $env:BUILD_PROFILE --locked -p greyscreen -p greyscreen-cli
      - name: Check exe imports and subsystem
        shell: pwsh
        run: ./scripts/check-windows-exe.ps1 "target/$env:BUILD_PROFILE"
      - uses: actions/upload-artifact@v7
        with:
          name: greyscreen-windows-x64
          path: |
            target/${{ env.BUILD_PROFILE }}/greyscreen.exe
            target/${{ env.BUILD_PROFILE }}/greyscreen-cli.exe
          if-no-files-found: error
          retention-days: 7
