name: Windows

# Runs on Andres's Windows PC (self-hosted runner, labels greyscreen and windows), manual or called by Release.
# Fork pull requests need approval before any workflow runs, so outside code cannot reach the PC unasked.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: [self-hosted, windows, greyscreen]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          clean: false
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
