name: macOS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install librsvg
        run: brew install librsvg
      - name: Build the app bundle
        run: packaging/macos/build-app.sh --no-install
        env:
          BUILD_PROFILE: ci-release
      - name: Pack the app bundle
        run: ditto -c -k --keepParent dist/mac/Greyscreen.app Greyscreen-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: greyscreen-macos
          path: Greyscreen-macos.zip
          if-no-files-found: error
          retention-days: 7
