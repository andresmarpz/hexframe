name: Tests

# Per-push CI is three workflows, one badge each: Tests (macOS), Windows and macOS (app bundle).
# Doc-only, website and backend changes skip them. A new push cancels the older run of the same PR only,
# so every push to main finishes and the badges never show a cancelled run. Releases are built locally, never here.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'apps/web/**'
      - 'apps/api/**'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install ffmpeg
        run: brew install ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
