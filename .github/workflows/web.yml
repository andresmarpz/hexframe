name: Web

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'brand/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/web.yml'
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
