name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-targets: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: cargo fmt --all --check
      - run: cargo test --workspace --exclude greyscreen --locked
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    env:
      BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'ci-release' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo build --profile $env:BUILD_PROFILE --locked -p greyscreen -p greyscreen-cli
      - name: Check exe imports and subsystem
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { throw 'dumpbin not found' }
          $dir = "target/$env:BUILD_PROFILE"
          foreach ($exe in 'greyscreen.exe', 'greyscreen-cli.exe') {
            $deps = (& $dumpbin /dependents "$dir/$exe") -join "`n"
            Write-Host $deps
            if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "$exe imports the C runtime dynamically" }
          }
          $gui = (& $dumpbin /headers "$dir/greyscreen.exe") -join "`n"
          if ($gui -notmatch 'subsystem \(Windows GUI\)') { throw 'greyscreen.exe is not a GUI subsystem exe' }
          $cui = (& $dumpbin /headers "$dir/greyscreen-cli.exe") -join "`n"
          if ($cui -notmatch 'subsystem \(Windows CUI\)') { throw 'greyscreen-cli.exe is not a console subsystem exe' }
      - uses: actions/upload-artifact@v7
        with:
          name: greyscreen-windows-x64
          path: |
            target/${{ env.BUILD_PROFILE }}/greyscreen.exe
            target/${{ env.BUILD_PROFILE }}/greyscreen-cli.exe
          if-no-files-found: error

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.52.2
