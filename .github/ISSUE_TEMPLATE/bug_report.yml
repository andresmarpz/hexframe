name: Bug report
description: Something in Greyscreen does not work
body:
  - type: markdown
    attributes:
      value: Do not post recordings with voice chat or full logs; trim them first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: build
    attributes:
      label: Greyscreen build
      placeholder: from the first line of the log
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
  - type: dropdown
    id: display-mode
    attributes:
      label: Game display mode
      options:
        - Borderless
        - Windowed
        - Fullscreen
  - type: textarea
    id: steps
    attributes:
      label: Steps
