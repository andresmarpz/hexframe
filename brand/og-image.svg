    <linearGradient id="og-card-bg" x1="648" y1="112" x2="648" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D1E22"/>
      <stop offset="100%" stop-color="#17181B"/>
