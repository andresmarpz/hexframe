  <!-- Tagline area -->
  <text x="84" y="294" fill="#EFF0F2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="-0.5">Automatic League of Legends</text>
  <text x="84" y="334" fill="#EFF0F2" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="-0.5">game recorder and review timeline.</text>

  <text x="84" y="388" fill="#A2A5AA" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400">GPU-encoded captures, automatic highlight clips, zero bloat.</text>

