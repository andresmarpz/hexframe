  <rect width="1200" height="630" fill="url(#og-grid)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>
  <rect width="1200" height="630" fill="url(#og-glow-right)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" stroke="#FFFFFF" stroke-opacity="0.06"/>

