    <linearGradient id="og-viewport" x1="672" y1="184" x2="1116" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0E1014"/>
    </linearGradient>
    <linearGradient id="og-hex" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EA7FF"/>
      <stop offset="100%" stop-color="#3582E8"/>
    </linearGradient>
  </defs>

