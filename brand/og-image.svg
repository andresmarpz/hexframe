      <stop offset="100%" stop-color="#0E0F11"/>
    </linearGradient>
    <radialGradient id="og-glow" cx="260" cy="240" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4392F7" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#4392F7" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#4392F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="og-glow-right" cx="920" cy="340" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4392F7" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#4392F7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="og-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.045"/>
